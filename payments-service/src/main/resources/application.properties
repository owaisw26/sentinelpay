spring.application.name=payments-service

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/sentinelpay}
spring.datasource.username=${DB_USERNAME:sentinelpay}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.mvc.problemdetails.enabled=true

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

sentinelpay.outbox.poll-ms=1000
sentinelpay.outbox.batch-size=50
sentinelpay.outbox.lease-seconds=30
sentinelpay.outbox.retry-base-ms=1000
sentinelpay.outbox.retry-max-ms=300000

sentinelpay.aws.endpoint=${AWS_ENDPOINT:http://localhost:4566}
sentinelpay.aws.region=${AWS_REGION:ap-southeast-2}
sentinelpay.sqs.payment-events-url=${PAYMENT_EVENTS_QUEUE_URL:http://sqs.ap-southeast-2.localhost.localstack.cloud:4566/000000000000/payment-events}
sentinelpay.sqs.long-poll-seconds=10
sentinelpay.sqs.visibility-timeout-seconds=30
sentinelpay.sqs.retry-base-seconds=1
sentinelpay.sqs.retry-max-seconds=300

sentinelpay.psp.mode=SUCCESS
sentinelpay.psp.attempt-lease-seconds=30
sentinelpay.psp.webhook-secret=${PSP_WEBHOOK_SECRET}
sentinelpay.psp.webhook-tolerance-seconds=300

sentinelpay.reconciliation.stale-after-seconds=300
sentinelpay.reconciliation.batch-size=100
sentinelpay.reconciliation.poll-ms=60000
