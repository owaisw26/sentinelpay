services:
  postgres:
    image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    container_name: sentinelpay-postgres
    environment:
      POSTGRES_DB: sentinelpay
      POSTGRES_USER: sentinelpay
      POSTGRES_PASSWORD: sentinelpay_dev
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/01-fraud-role.sql:/docker-entrypoint-initdb.d/01-fraud-role.sql:ro
      - ./fraud-service/migrations/V1__fraud_streaming.sql:/docker-entrypoint-initdb.d/02-fraud-schema.sql:ro
      - ./fraud-service/migrations/V2__add_anomaly_decision_audit.sql:/docker-entrypoint-initdb.d/03-fraud-anomaly.sql:ro
      - ./fraud-service/migrations/V3__human_approved_rule_proposals.sql:/docker-entrypoint-initdb.d/04-fraud-rules.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinelpay -d sentinelpay"]
      interval: 5s
      timeout: 5s
      retries: 5

  localstack:
    image: localstack/localstack:4.14.0@sha256:3ebc37595918b8accb852f8048fef2aff047d465167edd655528065b07bc364a
    container_name: sentinelpay-localstack
    environment:
      SERVICES: sqs,sns
    ports:
      - "4566:4566"
    volumes:
      - ./infra/localstack/init-aws.sh:/etc/localstack/init/ready.d/init-aws.sh:ro
    healthcheck:
      test: ["CMD", "awslocal", "sqs", "get-queue-url", "--queue-name", "fraud-events", "--region", "ap-southeast-2"]
      interval: 3s
      timeout: 3s
      retries: 20

  fraud-db-migrate:
    image: postgres:17-alpine
    environment:
      PGHOST: postgres
      PGDATABASE: sentinelpay
      PGUSER: sentinelpay
      PGPASSWORD: sentinelpay_dev
    command:
      - sh
      - -ec
      - psql -v ON_ERROR_STOP=1 -f /migrations/01-fraud-role.sql && psql -v ON_ERROR_STOP=1 -f /migrations/V1__fraud_streaming.sql && psql -v ON_ERROR_STOP=1 -f /migrations/V2__add_anomaly_decision_audit.sql && psql -v ON_ERROR_STOP=1 -f /migrations/V3__human_approved_rule_proposals.sql
    volumes:
      - ./infra/postgres/01-fraud-role.sql:/migrations/01-fraud-role.sql:ro
      - ./fraud-service/migrations/V1__fraud_streaming.sql:/migrations/V1__fraud_streaming.sql:ro
      - ./fraud-service/migrations/V2__add_anomaly_decision_audit.sql:/migrations/V2__add_anomaly_decision_audit.sql:ro
      - ./fraud-service/migrations/V3__human_approved_rule_proposals.sql:/migrations/V3__human_approved_rule_proposals.sql:ro
    depends_on:
      postgres:
        condition: service_healthy

  fraud-service:
    build: ./fraud-service
    restart: unless-stopped
    environment:
      AWS_REGION: ap-southeast-2
      AWS_ENDPOINT: http://localstack:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      FRAUD_EVENTS_QUEUE_URL: http://localstack:4566/000000000000/fraud-events
      RISK_DECISIONS_TOPIC_ARN: arn:aws:sns:ap-southeast-2:000000000000:risk-decisions
      FRAUD_DB_DSN: postgresql://fraud_runtime:fraud_local_only@postgres:5432/sentinelpay
      FRAUD_ALLOWED_LATENESS_SECONDS: 30
      FRAUD_MAXIMUM_FUTURE_SKEW_SECONDS: 30
      FRAUD_RECONNECT_SECONDS: 2
    depends_on:
      postgres:
        condition: service_healthy
      fraud-db-migrate:
        condition: service_completed_successfully
      localstack:
        condition: service_healthy

  fraud-api:
    build: ./fraud-service
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8001"]
    environment:
      FRAUD_DB_DSN: postgresql://fraud_runtime:fraud_local_only@postgres:5432/sentinelpay
      FRAUD_INTERNAL_TOKEN: ${FRAUD_INTERNAL_TOKEN:-sentinelpay-local-internal-only}
      RULE_PROPOSAL_PROVIDER: ${RULE_PROPOSAL_PROVIDER:-stub}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_RULE_MODEL: ${OPENAI_RULE_MODEL:-gpt-5.4-mini-2026-03-17}
      OPENAI_TIMEOUT_SECONDS: 20
      OPENAI_MAX_OUTPUT_TOKENS: 8000
    ports:
      - "${FRAUD_API_PORT:-8001}:8001"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 12
    depends_on:
      postgres:
        condition: service_healthy
      fraud-db-migrate:
        condition: service_completed_successfully

  payments-db-migrate:
    image: flyway/flyway:13.7.0-alpine@sha256:4b95b4ba46a948262ee3420a112d233992cdbd3f73bab37335d8f3cd9e5e369d
    command:
      - -url=jdbc:postgresql://postgres:5432/sentinelpay
      - -user=sentinelpay
      - -password=sentinelpay_dev
      - -connectRetries=20
      - -locations=filesystem:/flyway/migrations
      - migrate
    volumes:
      - ./payments-service/src/main/resources/db/migration:/flyway/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy

  payments:
    build: ./payments-service
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_FLYWAY_ENABLED: "false"
      DB_URL: jdbc:postgresql://postgres:5432/sentinelpay
      DB_USERNAME: sentinelpay
      DB_PASSWORD: sentinelpay_dev
      AWS_ENDPOINT: http://localstack:4566
      AWS_REGION: ap-southeast-2
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      PAYMENT_EVENTS_TOPIC_ARN: arn:aws:sns:ap-southeast-2:000000000000:payment-events
      PAYMENT_EVENTS_QUEUE_URL: http://localstack:4566/000000000000/payment-events
      RISK_DECISIONS_QUEUE_URL: http://localstack:4566/000000000000/risk-decisions
      FRAUD_SERVICE_URL: http://fraud-api:8001
      FRAUD_INTERNAL_TOKEN: ${FRAUD_INTERNAL_TOKEN:-sentinelpay-local-internal-only}
      SENTINELPAY_LOCAL_JWT_SECRET: ${SENTINELPAY_LOCAL_JWT_SECRET:-sentinelpay-local-jwt-secret-at-least-32-bytes}
      PSP_WEBHOOK_SECRET: ${PSP_WEBHOOK_SECRET:-sentinelpay-local-psp-secret}
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75.0 -XX:+ExitOnOutOfMemoryError
    ports:
      - "${PAYMENTS_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/actuator/health/readiness"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      payments-db-migrate:
        condition: service_completed_successfully
      localstack:
        condition: service_healthy
      fraud-api:
        condition: service_healthy

  dashboard:
    build:
      context: ./dashboard
      args:
        VITE_AUTH_MODE: local
    ports:
      - "${DASHBOARD_PORT:-3000}:8080"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--output-document=-", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 12
    depends_on:
      payments:
        condition: service_healthy


volumes:
  postgres_data:
