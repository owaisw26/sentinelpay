name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  java:
    name: Java
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: sentinelpay
          POSTGRES_USER: sentinelpay
          POSTGRES_PASSWORD: sentinelpay_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sentinelpay -d sentinelpay"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: payments-service

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run Java tests
        run: ./mvnw test

  python:
    name: Python
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: fraud-service

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Python tests
        run: pytest

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: dashboard

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build